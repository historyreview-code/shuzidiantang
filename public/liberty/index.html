<style>
:root{--ink:#e9eee9;--muted:#a5b0a9;--line:rgba(220,235,225,.16);--glass:rgba(13,22,21,.72);--accent:#a7d9c6}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#101817;color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}button,a{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#viewer{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 43%,transparent 30%,rgba(2,7,7,.24) 100%)}
.topbar{position:fixed;z-index:3;top:0;left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;padding:30px 36px;pointer-events:none}.brand,.actions{pointer-events:auto}.eyebrow{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}.brand h1{font-family:Georgia,"Songti SC",serif;font-size:clamp(25px,3vw,40px);font-weight:400;letter-spacing:.04em;margin:0}.brand p{margin:7px 0 0;color:var(--muted);font-size:12px;letter-spacing:.12em}.actions{display:flex;gap:8px}.pill{height:38px;display:inline-flex;align-items:center;justify-content:center;padding:0 15px;border:1px solid var(--line);border-radius:99px;background:var(--glass);backdrop-filter:blur(14px);font-size:12px;color:var(--ink);transition:.2s}.pill:hover{border-color:rgba(167,217,198,.55);background:rgba(30,48,44,.85)}
.side{position:fixed;z-index:3;left:36px;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;display:flex;gap:16px;align-items:center;color:var(--muted);font-size:9px;letter-spacing:.26em;text-transform:uppercase;pointer-events:none}.side:before{content:"";width:1px;height:50px;background:var(--line)}
.bottom{position:fixed;z-index:3;left:36px;right:36px;bottom:26px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}.hint{font-size:11px;color:var(--muted);letter-spacing:.06em}.controls{display:flex;gap:8px;pointer-events:auto}.icon{width:40px;padding:0}.icon.active{color:#102019;background:var(--accent);border-color:var(--accent)}
#loading{position:fixed;z-index:5;inset:0;display:grid;place-items:center;background:#101817;transition:opacity .5s}#loading.hidden{opacity:0;pointer-events:none}.loader{text-align:center}.loader-ring{width:36px;height:36px;border:1px solid var(--line);border-top-color:var(--accent);border-radius:50%;margin:0 auto 16px;animation:spin 1s linear infinite}.loader p{font-size:11px;letter-spacing:.16em;color:var(--muted)}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:700px){.topbar{padding:20px}.brand p,.side,.hint{display:none}.actions{gap:6px}.pill{height:34px;padding:0 11px;font-size:11px}.bottom{left:20px;right:20px;bottom:20px;justify-content:flex-end}.brand h1{font-size:25px}.eyebrow{font-size:8px}}
@media(prefers-reduced-motion:reduce){.loader-ring{animation:none}}
</style>
</head>
<body>
<div id="viewer" aria-label="可旋转缩放的自由女神像三维模型"></div><div class="vignette"></div>
<header class="topbar"><div class="brand"><div class="eyebrow">Liberty · 1886</div><h1>自由女神像</h1><p>交互 3D · 原始高精度版</p></div><nav class="actions" aria-label="作品导航与模型下载"><a class="pill" href="/works/">返回作品馆</a><button class="pill" id="download" type="button">下载 GLB</button></nav></header>
<div class="side">Oxidized copper · Granite</div>
<footer class="bottom"><div class="hint">拖动旋转 · 滚轮缩放 · 右键平移</div><div class="controls"><button class="pill icon" id="reset" title="重置视角" aria-label="重置视角">⌖</button><button class="pill icon" id="rotate" title="自动旋转" aria-label="自动旋转">↻</button></div></footer>
<div id="loading"><div class="loader"><div class="loader-ring"></div><p>正在载入原版雕塑 · 约 15 MB</p></div></div>

</body></html>
