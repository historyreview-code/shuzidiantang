<svg xmlns="http://www.w3.org/2000/svg" width="400" height="340" viewBox="0 0 400 340">
  <!-- 墨枝：从左缘探入的干笔淡墨 + 两粒朱砂批点（呼应片头"一粒墨生根开花"） -->
  <defs>
    <filter id="dry" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="turbulence" baseFrequency="0.09" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7"/>
    </filter>
  </defs>
  <g filter="url(#dry)" fill="none" stroke-linecap="round">
    <path d="M-30 300 C 90 290, 170 250, 250 190" stroke="rgba(42,37,28,.20)" stroke-width="7"/>
    <path d="M120 262 C 160 230, 185 208, 210 168" stroke="rgba(42,37,28,.16)" stroke-width="4"/>
    <path d="M175 236 C 210 226, 245 222, 285 226" stroke="rgba(42,37,28,.13)" stroke-width="3"/>
    <path d="M250 190 C 275 176, 295 172, 318 174" stroke="rgba(42,37,28,.11)" stroke-width="2.2"/>
  </g>
  <g filter="url(#dry)">
    <ellipse cx="238" cy="180" rx="9" ry="12" fill="rgba(42,37,28,.15)" transform="rotate(-24 238 180)"/>
    <ellipse cx="300" cy="172" rx="7" ry="9" fill="rgba(42,37,28,.12)" transform="rotate(14 300 172)"/>
    <circle cx="196" cy="160" r="7" fill="rgba(168,63,46,.30)"/>
    <circle cx="330" cy="176" r="5" fill="rgba(168,63,46,.24)"/>
  </g>
</svg>
