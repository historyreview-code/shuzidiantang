<svg xmlns="http://www.w3.org/2000/svg" width="480" height="400" viewBox="0 0 480 400">
  <!-- 彩墨簇：页尾纸边的试笔晕染——琥珀 × 松绿 × 黛蓝，每朵带深色水痕边 -->
  <defs>
    <filter id="bloom" x="-40%" y="-40%" width="180%" height="180%">
      <feTurbulence type="turbulence" baseFrequency="0.012" numOctaves="3" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="90"/>
    </filter>
    <filter id="bloom2" x="-40%" y="-40%" width="180%" height="180%">
      <feTurbulence type="turbulence" baseFrequency="0.016" numOctaves="3" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="70"/>
    </filter>
  </defs>
  <g filter="url(#bloom)">
    <ellipse cx="250" cy="160" rx="170" ry="105" fill="rgba(180,85,30,.10)"/>
    <ellipse cx="250" cy="160" rx="170" ry="105" fill="none" stroke="rgba(180,85,30,.16)" stroke-width="4"/>
  </g>
  <g filter="url(#bloom2)">
    <ellipse cx="355" cy="250" rx="120" ry="80" fill="rgba(90,112,80,.10)"/>
    <ellipse cx="355" cy="250" rx="120" ry="80" fill="none" stroke="rgba(90,112,80,.15)" stroke-width="3.5"/>
  </g>
  <g filter="url(#bloom)">
    <ellipse cx="160" cy="295" rx="88" ry="60" fill="rgba(93,107,122,.09)"/>
    <ellipse cx="160" cy="295" rx="88" ry="60" fill="none" stroke="rgba(93,107,122,.13)" stroke-width="3"/>
  </g>
  <g filter="url(#bloom2)">
    <ellipse cx="285" cy="190" rx="42" ry="30" fill="rgba(180,85,30,.13)"/>
  </g>
  <circle cx="125" cy="210" r="6" fill="rgba(168,63,46,.26)"/>
</svg>
