<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#183f47"><title>海岸慢递 · Seaside Delivery</title><meta name="description" content="沿着雨后的环岛路，把时间交给海风。可交互的微缩海岸骑行。"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23183f47'/%3E%3Ccircle cx='9' cy='21' r='5' fill='none' stroke='%23e9bc73' stroke-width='2'/%3E%3Ccircle cx='24' cy='21' r='5' fill='none' stroke='%23e9bc73' stroke-width='2'/%3E%3Cpath d='M9 21l6-11 9 11H9l3-8h7' fill='none' stroke='%23e47559' stroke-width='2'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"><script type="importmap">{"imports":{"three":"./vendor/three.webgpu.js","three/webgpu":"./vendor/three.webgpu.js","three/tsl":"./vendor/three.tsl.js"}}</script></head><body>
<main id="world" aria-label="海岸微缩骑行场景"><canvas id="scene" aria-label="拖动左右转向，空格暂停，方向键控制自行车"></canvas></main>
<div class="vignette" aria-hidden="true"></div>
<header><div class="wordmark"><span class="overline">SEASIDE DELIVERY · 01</span><h1>海岸慢递<span>雨后，沿海而行。</span></h1></div><button id="forge-toggle" class="glass" aria-expanded="false" aria-controls="forge"><span class="sliders">☷</span> Forge <span class="tiny">调节世界</span></button></header>
<div class="compass" aria-hidden="true"><span>N</span><i></i><small>环岛路 · 海风向东</small></div>
<aside id="forge" class="glass" hidden><div class="panel-head"><div><span class="overline">MAKE IT YOURS</span><h2>Forge <small>世界参数</small></h2></div><button id="close-panel" aria-label="关闭参数面板">×</button></div><div id="controls"></div><div class="presets"><label for="preset">画面预设</label><select id="preset"><option value="afterrain">雨后暖光</option><option value="bluehour">蓝调时刻</option><option value="bright">晴海午后</option></select></div><div class="panel-actions"><button id="save">保存</button><button id="load">读取</button><button id="export">导出</button><button id="import">导入</button><button id="reset">恢复默认</button></div><input type="file" id="file" accept="application/json" hidden><p class="panel-note">种子与店铺变化在重新生成时生效，其余参数实时生效。</p></aside>
<footer><div class="ride-bar glass"><button id="pause" aria-label="暂停骑行">Ⅱ</button><div class="bar-divider"></div><div class="speed-control"><label for="speed-main">巡游速度 <output id="speed-label">12 km/h</output></label><input id="speed-main" type="range" min="0" max="24" step="1" value="12"></div><button id="auto" aria-pressed="true" title="切换自动巡游">自动</button></div><div class="footer-meta"><span id="distance">0000 m</span><span class="separator">/</span><span id="weather">雨后 · 微风</span><button id="stats-toggle" aria-label="显示运行统计">◌</button></div></footer>
<div id="hint">拖动转向 <span>·</span> 空格暂停 <span>·</span> 沿海漫游</div><div id="toast" role="status"></div><div id="loading"><div class="load-icon">☀</div><p>海风正在抵达…</p></div><div id="stats" class="glass" hidden></div><script type="module" src="app.js"></script></body></html>
