<main class="reader-main"><article class="reader-article"><section xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" class="chapter plates" id="back-plates"><h2>书后图版：战俘、受降与归途</h2><figure class="historical-plate" id="plate04"><h3>1904年松山医院手术室中的俄军战俘</h3><span></span><figcaption><p>1904年松山医院手术室中的俄军战俘。原卡片把患者、医护人员和手术台留在同一个画面里，英文与日文题签也一并保存。第九章的战俘待遇和第十六章的战争代价，在这里有了共同的入口：负伤者的生命进入医疗机构，救护能力与看守制度共同塑造他的处境。照片呈现的是松山医院的一幕，对战争中各处俘虏生活的判断，还要回到各自的记录。</p><p class="plate-credit">Yegi-Honten 摄，《Russian prisoner in operating room (McGee 9128)》；National Museum of Health and Medicine，Otis Historical Archives，OHA 227: McGee Collection，McGee 9128；经馆方 Flickr / Wikimedia Commons，CC BY 2.0。本项目仅无损转存，保留卡片全幅。 <a href="https://commons.wikimedia.org/wiki/File:Russian_prisoner_in_operating_room_(McGee_9128),_National_Museum_of_Health_and_Medicine_(4437540557).jpg">图版出处</a></p></figcaption></figure><figure class="historical-plate" id="plate05"><h3>1945年日本投降书正文与签字页</h3><span></span><figcaption><p>1945年日本投降书正文与签字页。9月2日，日方代表与盟国代表在密苏里号上签署。正文规定受降和执行降伏的权力，签字页则把这一权力安排落到各方代表的姓名上。第十五至十七章由战场结束转入战俘、抑留与遣返，文书在这里构成一个重要界标：国家已经签字，军人和平民的归家路程仍将继续，战争留下的责任也进入新的政治秩序。</p><p class="plate-credit">日本投降书，1945年9月2日；美国国家档案馆（NARA），Records of the U.S. Joint Chiefs of Staff，RG 218，NAID 1752336。此数字图经 Wikimedia Commons 转存自 ourdocuments.gov，保留正文页与签字页；美国公版标记。 <a href="https://commons.wikimedia.org/wiki/File:Instrument_of_surrender_Japan.jpg">图版出处</a></p></figcaption></figure><figure class="historical-plate" id="plate06"><h3>从苏联归国的原日军人员抵达舞鹤接收中心</h3><span></span><figcaption><p>1950年1月23日，从苏联归国的原日军人员抵达舞鹤接收中心。人们带着行李列队，远处的山坡和近处的场地，成为归途最后一段的背景。第十七章叙述遣返怎样逐批展开，这张照片保存了其中一天。船抵港口之后，登记、安置与返乡继续进行；在国家间安排之外，每个人还要重新寻找家庭、职业和日常生活的位置。</p><p class="plate-credit">Dangel 摄，美国陆军通信兵，SC 337415，1950年1月23日；经 Signal Corps Archive / Wikimedia Commons，美国联邦政府作品公版标记（美国）。 <a href="https://commons.wikimedia.org/wiki/File:SC_337415_-_Japanese_repatriates_prepare_to_start_a_new_life_as_free_citizens_in_a_new_Japan._(52205403672).jpg">图版出处</a></p></figcaption></figure></section>
