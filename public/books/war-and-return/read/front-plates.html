<main class="reader-main"><article class="reader-article"><section xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" class="chapter plates" id="front-plates"><h2>书前图版：抵达战场</h2><figure class="historical-plate" id="plate01"><h3>环贝加尔铁路隧道施工</h3><span></span><figcaption><p>环贝加尔铁路隧道施工。20世纪初，确切摄年未详。岩壁下的洞口、木支架和洞前枕木，留下了铁路穿越山地的施工痕迹。第一章讨论俄军增援速度，这幅照片提供了一个近处的观察：运兵表上的里程，要靠凿石、筑路和铺轨逐段实现。运输线的承载能力，始终牵动着前线的时间与兵力。</p><p class="plate-credit">俄罗斯国家历史博物馆藏（Из собрания Исторического музея），对象 5845439；摄影者未详。图像经 Wikimedia Commons，PD-Russia-1996；非商业使用按馆方条款注明来源。 <a href="https://commons.wikimedia.org/wiki/File:Байкал._Кругобайкальская_ж.-д._Сооружение_тоннеля_в_скальном_грунте._1900-1904гг_ГИМ_e1.jpg">图版出处</a></p></figcaption></figure><figure class="historical-plate" id="plate02"><h3>旅顺日军战壕中的士兵</h3><span></span><figcaption><p>旅顺日军战壕中的士兵。1904—1905年战争期间，立体照片发行于1905年。原卡片并列的两幅影像，用视差营造战壕的纵深；这里保留整张卡片及其边缘。第四章的攻城叙述落到这片狭窄的土壁之间：士兵在掩蔽处停留、等待，远处堡垒的争夺由此与近处的日常相接。照片记录一个片刻，全场战斗的进程仍须结合战报理解。</p><p class="plate-credit">美国国会图书馆，LC-USZ62-112666，LOT 11691-11，立体照片 No.7596；Underwood &amp; Underwood 发行，1905年；馆方记“无已知出版限制”。 <a href="https://www.loc.gov/pictures/collection/stereo/item/95502909/">图版出处</a></p></figcaption></figure><figure class="historical-plate" id="plate03"><h3>吴港的日本战列舰三笠号</h3><span></span><figcaption><p>吴港的日本战列舰三笠号。1905年2月初。双烟囱、桅杆与炮塔，使联合舰队旗舰的轮廓清楚可辨。第八章讨论舰队决战，这张战前照片给叙述留下了一把尺度：火力、航速和防护都要安放在有限的船体里，指挥与协同则落实到舰上官兵的操作。港中静泊的军舰，承载着海上决战以前的整备与等待。</p><p class="plate-credit">呉市海事歴史科学館（大和ミュージアム）藏；摄影者未详。图像经 Wikimedia Commons，PD-Japan-oldphoto、PD-1996；馆方转载手续尚待核定。 <a href="https://commons.wikimedia.org/wiki/File:Japanese_battleship_Mikasa.jpg">图版出处</a></p></figcaption></figure></section>
