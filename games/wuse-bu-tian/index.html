<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>五色石·补天记</title>
<style>
  html,body{margin:0;height:100%;background:#0b0e1a;overflow:hidden;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    display:flex;align-items:center;justify-content:center}
  #wrap{position:relative}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;
    border-radius:12px;box-shadow:0 12px 60px rgba(0,0,0,.55)}
  #hint{position:fixed;bottom:8px;right:14px;color:#5a6080;font-size:12px;user-select:none}
  #desktop-note{display:none;position:fixed;top:12px;left:50%;transform:translateX(-50%);
    background:rgba(12,16,30,.92);border:1px solid #3fe0ff;color:#c8f6ff;
    font-size:13px;padding:8px 16px;border-radius:8px;z-index:9;white-space:nowrap}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="960" height="540"></canvas></div>
<div id="hint">💻 电脑端游戏（键盘操作）· ←→移动 · ↑/空格跳 · X挖 · K放 · C冲刺 · E对话 · M音效 · Esc暂停</div>
<div id="desktop-note">💻 本作为电脑端游戏，需键盘操作，请用电脑开玩（手机暂不支持）</div>
<script>
  if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
    document.getElementById('desktop-note').style.display = 'block';
  }
</script>
<script src="engine.js"></script>
<script src="levels.js"></script>
<script src="game.js"></script>
</body>
</html>
