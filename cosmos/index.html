<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天文馆 · 数字殿堂</title>
<meta name="description" content="数字殿堂天文馆：太阳系漫游、宇宙简史、大爆炸到今天的 3D 沉浸科普——馆内直接放映。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230a0d18' stroke='%23d8b45a'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='%23d8b45a' font-family='serif'>殿</text></svg>">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .player-wrap { max-width: 1100px; margin: 0 auto 10px; }
  .player-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    padding: 10px 16px; border: 1px solid var(--line); border-bottom: 0;
    border-radius: 12px 12px 0 0; background: rgba(17,21,39,.85);
    font-size: .88rem; color: var(--text-dim);
  }
  .player-bar strong { color: var(--gold-bright); }
  .player-bar .open-link { color: var(--gold); white-space: nowrap; letter-spacing: 1px; }
  .player-frame {
    position: relative; width: 100%; aspect-ratio: 16 / 9;
    background: #000; border: 1px solid var(--line);
    border-radius: 0 0 12px 12px; overflow: hidden;
    box-shadow: 0 14px 44px rgba(0,0,0,.55), 0 0 30px rgba(216,180,90,.08);
  }
  .player-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  .player-note { margin-top: 10px; text-align: center; font-size: .8rem; color: var(--text-dim); }
  .work-card { width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; }
  .work-card .go { display: block; margin-top: 10px; font-size: .82rem; color: var(--gold); letter-spacing: 2px; }
  .work-card.on { border-color: var(--gold); box-shadow: 0 0 18px rgba(216,180,90,.18); }
</style>
</head>
<body>
<header class="site-header">
  <a class="brand" href="/">
    <span class="mark">殿</span>
    <span class="name">数字殿堂<small>DIGITAL HALL</small></span>
  </a>
  <nav class="site-nav">
    <a href="/">正殿</a>
    <a href="/earth/">地球厅</a>
    <a href="/games/">游戏厅</a>
    <a href="/novels/">文学馆</a>
    <a class="active" href="/cosmos/">天文馆</a>
    <a href="/about/">馆主手记</a>
  </nav>
</header>

<main>
  <section class="page-head">
    <h1>天文馆</h1>
    <p>头顶的奇珍在此展开 · 馆内直接放映</p>
  </section>

  <section class="player-wrap">
    <div class="player-bar">
      <span>🎬 正在放映：<strong id="now-title">宇宙之旅</strong></span>
      <a id="now-open" class="open-link" href="https://historyreview-code.github.io/cosmic-journey/" target="_blank" rel="noopener">全屏体验 ↗</a>
    </div>
    <div class="player-frame">
      <iframe id="player" src="https://historyreview-code.github.io/cosmic-journey/" title="宇宙之旅" allow="fullscreen; autoplay; encrypted-media" allowfullscreen></iframe>
    </div>
    <p class="player-note">点击下方作品切换放映 · 若配音未自动播放，点击画面任意位置即可 · 载入缓慢时可用"全屏体验"在新窗口打开</p>
  </section>

  <section class="section">
    <h2>馆藏作品</h2>
    <div class="card-grid">
      <button type="button" class="card work-card on" data-src="https://historyreview-code.github.io/cosmic-journey/" data-title="宇宙之旅">
        <h3>🚀 宇宙之旅</h3>
        <p>太阳系、银河、宇宙简史、宇宙探索史、登月与火星任务——中文配音配乐的沉浸科普。</p>
        <span class="go">入馆放映 →</span>
      </button>
      <button type="button" class="card work-card" data-src="https://historyreview-code.github.io/cosmic-evolution/" data-title="宇宙的诞生与演进">
        <h3>💥 宇宙的诞生与演进</h3>
        <p>从大爆炸到太阳系，交互式 3D 可视化——138 亿年的故事一屏看完。</p>
        <span class="go">入馆放映 →</span>
      </button>
      <button type="button" class="card work-card" data-src="https://historyreview-code.github.io/solar-ecliptic/" data-title="黄道与太阳系">
        <h3>☀️ 黄道与太阳系</h3>
        <p>日地月关系与黄道面交互图解。</p>
        <span class="go">入馆放映 →</span>
      </button>
    </div>
  </section>
</main>

<footer class="site-footer">
  <p>数字殿堂 · 天文馆</p>
  <p class="icp">（ICP 备案号待备案通过后展示）</p>
</footer>

<script>
  const player = document.getElementById('player');
  const nowTitle = document.getElementById('now-title');
  const nowOpen = document.getElementById('now-open');
  const cards = document.querySelectorAll('.work-card');
  cards.forEach(card => {
    card.addEventListener('click', () => {
      const src = card.dataset.src;
      player.src = src;
      nowTitle.textContent = card.dataset.title;
      nowOpen.href = src;
      cards.forEach(c => c.classList.remove('on'));
      card.classList.add('on');
      player.parentElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
</script>
</body>
</html>
