<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天文馆 · 数字殿堂</title>
<meta name="description" content="数字殿堂天文馆：全屏自动放映厅——宇宙之旅五集连播与宇宙演化全景，云健男声科普解说，即开即播；附科普场刊，完整解说词供静心阅读。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230a0d18' stroke='%23d8b45a'/><path fill='%23d8b45a' d='M16 2h11v11h-11zM30 2h11v11h-11zM44 2h11v11h-11zM16 16h11v11h-11zM58 16h11v11h-11zM16 30h11v11h-11zM58 30h11v11h-11zM16 44h11v11h-11zM58 44h11v11h-11zM16 58h11v11h-11zM58 58h11v11h-11zM16 72h11v11h-11zM58 72h11v11h-11zM16 86h11v11h-11zM30 86h11v11h-11zM44 86h11v11h-11z'/></svg>">
<link rel="stylesheet" href="../assets/style.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #020617; }
  #stage { position: fixed; inset: 0; }
  #stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #020617; }
  body:fullscreen #stage { inset: 0; }

  /* 顶部：品牌 + 当前放映提示 */
  #brand { position: fixed; top: 16px; left: 20px; z-index: 50; display: flex; align-items: center; gap: 10px;
    color: var(--gold-bright); font-family: var(--serif); letter-spacing: 3px; font-size: 1.05rem;
    text-decoration: none; transition: opacity .5s; text-shadow: 0 0 14px rgba(0,0,0,.8); }
  #brand .mark { width: 30px; height: 30px; border: 1px solid var(--gold); border-radius: 8px; display: grid; place-items: center; background: rgba(10,13,24,.7); }
  #now-playing { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); z-index: 40;
    padding: 7px 18px; border-radius: 999px; border: 1px solid rgba(216,180,90,.4); background: rgba(10,13,24,.72);
    color: #f0d68a; font-size: 13px; letter-spacing: .08em; backdrop-filter: blur(8px);
    transition: opacity .5s; text-shadow: none; }

  /* 底部控制条（自动隐藏） */
  #ctrl { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 50;
    display: flex; gap: 8px; align-items: center; transition: opacity .5s, transform .5s; }
  .cb { display: inline-flex; align-items: center; justify-content: center; min-width: 42px; height: 42px;
    padding: 0 14px; border-radius: 999px; border: 1px solid rgba(216,180,90,.55);
    background: rgba(10,13,24,.78); color: #f0d68a; font-size: 15px; cursor: pointer;
    text-decoration: none; backdrop-filter: blur(8px); letter-spacing: .05em; transition: background .2s; }
  .cb:hover { background: rgba(216,180,90,.25); }
  body.idle #ctrl, body.idle #now-playing, body.idle #brand { opacity: 0; pointer-events: none; }
  body.idle #ctrl { transform: translate(-50%, 22px); }
  body.idle { cursor: none; }

  /* 片单面板 */
  #playlist { position: fixed; top: 0; right: 0; bottom: 0; width: min(330px, 88vw); z-index: 60;
    background: rgba(10,13,24,.97); border-left: 1px solid var(--line);
    transform: translateX(102%); transition: transform .35s ease; display: flex; flex-direction: column; }
  #playlist.open { transform: translateX(0); }
  .pl-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px 12px;
    color: var(--gold-bright); font-family: var(--serif); letter-spacing: 2px; border-bottom: 1px solid var(--line); }
  .pl-head button { background: none; border: none; color: var(--text-dim); font-size: 22px; cursor: pointer; }
  .pl-body { flex: 1; overflow-y: auto; padding: 10px; }
  .pl-item { display: block; width: 100%; text-align: left; padding: 13px 16px; margin: 4px 0;
    background: none; border: 1px solid rgba(216,180,90,.14); border-radius: 10px;
    color: var(--text-dim); font-size: 14px; cursor: pointer; letter-spacing: .04em; transition: all .15s; }
  .pl-item:hover { border-color: var(--gold); color: var(--text); }
  .pl-item.on { border-color: var(--gold); color: var(--gold-bright); background: rgba(216,180,90,.08); }
  .pl-item small { display: block; color: var(--gold-dim); font-size: 11px; margin-top: 3px; letter-spacing: .12em; }
  .pl-foot { padding: 14px 20px 22px; color: var(--text-dim); font-size: 12px; line-height: 1.8; border-top: 1px solid var(--line); }
  .pl-foot a { color: var(--gold); }

  @media (max-width: 640px) {
    #now-playing { font-size: 11px; top: 10px; padding: 5px 12px; }
    #brand { top: 10px; left: 12px; font-size: .9rem; }
    #brand .name small { display: none; }
  }
</style>
</head>
<body>

<div id="stage"><iframe id="frame" src="about:blank" allow="autoplay; fullscreen; encrypted-media" allowfullscreen title="天文馆放映厅"></iframe></div>

<a id="brand" href="/">
  <span class="mark"><svg viewBox="0 0 100 100" width="18" height="18" aria-hidden="true"><path fill="#d8b45a" d="M16 2h11v11h-11zM30 2h11v11h-11zM44 2h11v11h-11zM16 16h11v11h-11zM58 16h11v11h-11zM16 30h11v11h-11zM58 30h11v11h-11zM16 44h11v11h-11zM58 44h11v11h-11zM16 58h11v11h-11zM58 58h11v11h-11zM16 72h11v11h-11zM58 72h11v11h-11zM16 86h11v11h-11zM30 86h11v11h-11zM44 86h11v11h-11z"/></svg></span>
  <span>数字殿堂 · 天文馆</span>
</a>

<div id="now-playing">🎬 正在放映 · <span id="np-name">—</span></div>

<div id="ctrl">
  <button class="cb" id="btn-play" title="暂停 / 继续放映">⏸</button>
  <button class="cb" id="btn-prev" title="上一集">⏮</button>
  <button class="cb" id="btn-next" title="下一集">⏭</button>
  <button class="cb" id="btn-full" title="全屏">⛶</button>
  <button class="cb" id="btn-list" title="放映片单">🎞 片单</button>
  <a class="cb" href="/cosmos/articles/" title="科普场刊 · 完整解说词">📖 场刊</a>
  <a class="cb" href="/" title="返回首页">⛩</a>
</div>

<div id="playlist" aria-hidden="true">
  <div class="pl-head">🎬 放映片单 <button id="btn-close-list" aria-label="关闭">×</button></div>
  <div class="pl-body" id="pl-body"></div>
  <div class="pl-foot">
    全屏自动放映厅：进入即自动播放并逐集连播，每集结束自动进入下一集。<br>
    点击画面任意处可唤醒控制条；想看完整解说词可进 <a href="/cosmos/articles/">📖 科普场刊 →</a><br>
    <a href="/">返回数字殿堂首页 →</a>
  </div>
</div>

<script>
const PLAYLIST = [
  { name: "宇宙之旅 · 黄道面之谜", sub: "第 1 集 · 太阳系为何是一个平面", url: "https://historyreview-code.github.io/cosmic-journey/index.html?autoplay=1" },
  { name: "宇宙之旅 · 银河漫游", sub: "第 2 集 · 从太阳系到银河系之外", url: "https://historyreview-code.github.io/cosmic-journey/galaxy.html?autoplay=1" },
  { name: "宇宙之旅 · 宇宙简史", sub: "第 3 集 · 从大爆炸到黑洞", url: "https://historyreview-code.github.io/cosmic-journey/cosmos.html?autoplay=1" },
  { name: "宇宙之旅 · 仰望星空五千年", sub: "第 4 集 · 人类如何认识宇宙", url: "https://historyreview-code.github.io/cosmic-journey/history.html?autoplay=1" },
  { name: "宇宙之旅 · 揽月探火", sub: "第 5 集 · 人类如何走向另一颗星球", url: "https://historyreview-code.github.io/cosmic-journey/missions.html?autoplay=1" },
  { name: "宇宙的诞生与演进", sub: "短片 · 从大爆炸到旅行者号", url: "https://historyreview-code.github.io/cosmic-evolution/?autoplay=1" },
];

let idx = 0;
let paused = false;
const frame = document.getElementById("frame");
const npName = document.getElementById("np-name");

function renderPlaylist() {
  const body = document.getElementById("pl-body");
  body.innerHTML = "";
  PLAYLIST.forEach((item, i) => {
    const b = document.createElement("button");
    b.className = "pl-item" + (i === idx ? " on" : "");
    b.innerHTML = item.name + "<small>" + item.sub + "</small>";
    b.addEventListener("click", () => { load(i); closeList(); });
    body.appendChild(b);
  });
}

function updateUI() {
  npName.textContent = PLAYLIST[idx].name;
  document.querySelectorAll(".pl-item").forEach((el, i) => el.classList.toggle("on", i === idx));
}

function load(i) {
  idx = (i + PLAYLIST.length) % PLAYLIST.length;
  frame.src = PLAYLIST[idx].url;
  updateUI();
}

frame.addEventListener("load", () => {
  // 新集加载后：同步暂停状态 + 隐藏作品自带的剧集导航条
  try {
    frame.contentWindow.postMessage({ type: "chrome", show: false }, "*");
    frame.contentWindow.postMessage({ type: "autoplay", on: !paused }, "*");
  } catch (e) {}
});

window.addEventListener("message", (e) => {
  if (!e.data || typeof e.data !== "object") return;
  if (e.data.type === "episode-done" && !paused) {
    load(idx + 1);
  } else if (e.data.type === "goto") {
    load(e.data.dir === "next" ? idx + 1 : idx - 1);
  }
});

document.getElementById("btn-play").addEventListener("click", () => {
  paused = !paused;
  document.getElementById("btn-play").textContent = paused ? "▶" : "⏸";
  try { frame.contentWindow.postMessage({ type: "autoplay", on: !paused }, "*"); } catch (e) {}
});
document.getElementById("btn-prev").addEventListener("click", () => load(idx - 1));
document.getElementById("btn-next").addEventListener("click", () => load(idx + 1));
document.getElementById("btn-full").addEventListener("click", () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
});
document.getElementById("btn-list").addEventListener("click", () => {
  document.getElementById("playlist").classList.toggle("open");
});
document.getElementById("btn-close-list").addEventListener("click", closeList);
function closeList() { document.getElementById("playlist").classList.remove("open"); }
document.getElementById("playlist").addEventListener("click", (e) => {
  if (e.target === e.currentTarget) closeList();
});

// 控制条自动隐藏：4 秒无操作淡出，动一下即恢复
let idleTimer = null;
function wake() {
  document.body.classList.remove("idle");
  if (idleTimer) clearTimeout(idleTimer);
  idleTimer = setTimeout(() => document.body.classList.add("idle"), 4000);
}
["mousemove", "touchstart", "keydown"].forEach((ev) => window.addEventListener(ev, wake, { passive: true }));
wake();

renderPlaylist();
// 深链支持: /cosmos/?ep=<序号> 直接放映某一集 (科普场刊"进放映厅看本集"用)
const epParam = new URLSearchParams(location.search).get("ep");
if (epParam && /^\d+$/.test(epParam)) {
  load(Math.min(Math.max(Number(epParam), 0), PLAYLIST.length - 1));
} else {
  load(0);
}
</script>
</body>
</html>
