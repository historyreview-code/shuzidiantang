name: assemble-and-deploy-edgeone

on:
  # 每日 02:00 UTC 自动重建并部署 EdgeOne Pages：地球厅数据按日刷新
  # （EdgeOne 控制台另有 push 触发构建；本 workflow 负责定时数据刷新与手动兜底）
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edgeone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    name: 组装全站
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装主站依赖
        run: npm ci
      - name: 配置掼蛋后端
        env:
          MAKERS_API_TOKEN: ${{ secrets.EDGEONE_PAGES_API_TOKEN }}
          GUANDAN_MINIMAX_API_KEY: ${{ secrets.GUANDAN_MINIMAX_API_KEY }}
        run: |
          npm install --no-save --package-lock=false @edgeone/makers-sdk
          node scripts/guandan/configure-runtime.mjs
      - name: 清理过期掼蛋缓存
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          MAKERS_API_TOKEN: ${{ secrets.EDGEONE_PAGES_API_TOKEN }}
        run: node scripts/guandan/cleanup-cache.mjs
      - name: 缓存地球厅源码与依赖
        uses: actions/cache@v4
        with:
          path: |
            .cache/digital-earth-series
            .cache/pnpm-store
            .cache/npm-cache
          key: digital-earth-${{ runner.os }}-${{ hashFiles('scripts/assemble.mjs') }}
          restore-keys: |
            digital-earth-${{ runner.os }}-
      - name: 组装 dist/
        env:
          DIGITAL_EARTH_REFRESH: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: npm run assemble
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          retention-days: 7

  deploy:
    name: 部署 EdgeOne Pages
    needs: assemble
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist
      - name: 部署到 EdgeOne Pages
        env:
          T: ${{ secrets.EDGEONE_PAGES_API_TOKEN }}
          DEPLOY_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
        run: |
          TRIMMED=$(printf '%s' "$T" | tr -d '[:space:]')
          if [ -z "$TRIMMED" ]; then echo "::error::EDGEONE_PAGES_API_TOKEN 为空，请检查 GitHub Secrets"; exit 1; fi
          npx --yes edgeone@1.6.46 makers deploy ./dist --name shuzidiantang --env "$DEPLOY_ENV" --token "$TRIMMED"
