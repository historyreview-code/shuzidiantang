name: guandan-migration-check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false @edgeone/makers-sdk @edgeone/pages-blob
      - run: node scripts/guandan/check-platform.mjs
        env:
          MAKERS_API_TOKEN: ${{ secrets.EDGEONE_PAGES_API_TOKEN }}
