name: assemble-and-deploy

on:
  # 2026-08-31 已停：主站切至 EdgeOne Pages（push 触发），GitHub 侧仅保留手动兜底。
  # 如需恢复每日自动重建海外备份：取消注释 push/schedule 块。
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  assemble:
    name: 组装全站
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装主站依赖
        run: npm ci
      - name: 缓存地球厅源码与依赖
        uses: actions/cache@v4
        with:
          path: |
            .cache/digital-earth-series
            .cache/pnpm-store
            .cache/npm-cache
          key: digital-earth-${{ runner.os }}-${{ hashFiles('scripts/assemble.mjs') }}
          restore-keys: |
            digital-earth-${{ runner.os }}-
      - name: 组装 dist/
        env:
          DIGITAL_EARTH_REFRESH: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: npm run assemble
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: 部署 GitHub Pages（海外过渡）
    needs: assemble
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 说明：
  # - Cloudflare Pages 因账号级 pages.dev 子域封锁暂不可用（见 README ⑤），
  #   已改走 GitHub Pages 过渡，备案通过后按 ⑥ 切 EdgeOne Pages 国内主站。
  # - EdgeOne Pages 直接连接本仓库（控制台操作），构建命令 npm run assemble，输出目录 dist。
