name: assemble-and-deploy

on:
  push:
    branches: [main]
  schedule:
    # 每日 02:00 UTC 重建（地球厅数据由 GitHub Actions 每日更新，见 digital-earth-series）
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  assemble:
    name: 组装全站
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 组装 dist/
        run: npm run assemble
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 7

  deploy-cloudflare:
    name: 部署 Cloudflare Pages（配置密钥后自动启用）
    needs: assemble
    runs-on: ubuntu-latest
    steps:
      - name: 检查 Cloudflare 配置
        id: cf
        # 注意：secrets 不能用于 job 级 if，只能在步骤内检查
        run: |
          if [ -n "${{ secrets.CF_ACCOUNT_ID }}" ] && [ -n "${{ secrets.CF_API_TOKEN }}" ] && [ -n "${{ secrets.CF_PROJECT_NAME }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: 跳过部署（未配置密钥）
        if: steps.cf.outputs.ready == 'false'
        run: echo "未配置 CF_ACCOUNT_ID / CF_API_TOKEN / CF_PROJECT_NAME，跳过 Cloudflare 部署"
      - name: 下载产物
        if: steps.cf.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - name: 发布到 Cloudflare Pages
        if: steps.cf.outputs.ready == 'true'
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: ${{ secrets.CF_PROJECT_NAME }}
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  # 国内主站：EdgeOne Pages 直接连接本仓库（控制台操作），
  # 构建命令 npm run assemble，输出目录 dist —— 无需在此配置。
